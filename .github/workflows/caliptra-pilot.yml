name: Pinned Caliptra AXI pilot
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-axi-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison flex gperf help2man libfl-dev zlib1g-dev
      - name: Build pinned simulators and verify pilot evidence
        run: bash ci/run_caliptra_pilot.sh "$RUNNER_TEMP/qd-bfm-build"
      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caliptra-axi-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qd-bfm-build/evidence/
            !${{ runner.temp }}/qd-bfm-build/evidence/delay*/obj-*/**
          if-no-files-found: error
          retention-days: 30
